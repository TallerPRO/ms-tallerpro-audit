spring:
  datasource:
    url: jdbc:h2:mem:audit-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false   # la migracion usa plpgsql (trigger de inmutabilidad), no corre en H2
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      fail-fast: false

tallerpro:
  security:
    jwt-enabled: true
