server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ms-tallerpro-audit

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tallerpro_audit}
    username: ${DB_USER:tallerpro}
    password: ${DB_PASSWORD:tallerpro}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-tallerpro-audit
      auto-offset-reset: earliest
      enable-auto-commit: false
    admin:
      # Aplica retention.ms de los DLT tambien si los topicos ya existian (no solo al crearlos).
      modify-topic-configs: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:tenant-id}/v2.0
          audiences: api://${AZURE_API_CLIENT_ID:api-client-id}

tallerpro:
  security:
    # false -> desarrollo local sin tenant (usuario ficticio con dev-roles). Debe ser true en la nube.
    jwt-enabled: ${TALLERPRO_JWT_ENABLED:true}
    dev-roles: ${TALLERPRO_DEV_ROLES:Auditor}

app:
  kafka:
    topics:
      jobs-events: jobs.events
      audit-timeline: audit.timeline
      # DLT PROPIOS de este consumidor: jobs.events no comparte DLT con report.
      jobs-events-dlt: jobs.events.audit.DLT
      audit-timeline-dlt: audit.timeline.DLT
    audit-timeline:
      # Compactado: nada se compacta antes de 7 dias (audit persiste cada evento en su BD).
      min-compaction-lag-ms: 604800000
    dlt:
      partitions: 3
      replicas: ${KAFKA_REPLICAS:1}
      # 30 dias: tiempo para analizar y reprocesar los mensajes fallidos.
      retention-ms: 2592000000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.tallerpro.audit: INFO
