server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ms-tallerpro-audit

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tallerpro_audit}
    username: ${DB_USER:tallerpro}
    password: ${DB_PASSWORD:tallerpro}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-tallerpro-audit
      auto-offset-reset: earliest
      enable-auto-commit: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:tenant-id}/v2.0
          audiences: api://${AZURE_API_CLIENT_ID:api-client-id}

tallerpro:
  security:
    # false -> desarrollo local sin tenant (usuario ficticio con dev-roles). Debe ser true en la nube.
    jwt-enabled: ${TALLERPRO_JWT_ENABLED:true}
    dev-roles: ${TALLERPRO_DEV_ROLES:Auditor}

app:
  kafka:
    topics:
      jobs-events: jobs.events
      audit-timeline: audit.timeline

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.tallerpro.audit: INFO
